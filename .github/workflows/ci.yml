name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:  # for the warehouse tests (tests/test_warehouse.py)
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway CI database, no credential in the repo
          POSTGRES_DB: gtm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GTM_TEST_PG_URL: postgresql://postgres@localhost:5432/gtm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,review,warehouse]"
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: README quick start (scripts/demo.sh)
        run: bash scripts/demo.sh
      - name: End-to-end smoke test on the sample data
        run: |
          gtm --db ci.db init
          gtm --db ci.db load --orgs data/sample/organizations.csv \
            --people data/sample/people.csv --deals data/sample/deals.csv \
            --signals data/sample/signals.csv --suppressions data/sample/suppressions.csv
          gtm --db ci.db score --as-of 2026-10-26 --top 5 --out out.csv
          gtm --db ci.db health --as-of 2026-10-26
          gtm --db ci.db enrich --limit 20 --min-employees 20 --report report.md
          gtm --db ci.db export --format lemlist --out lemlist.csv --include-unverified
          gtm --db ci.db export --format pipedrive --out pipedrive.csv --min-score 45 \
            --include-unverified --as-of 2026-10-26
          gtm --db ci.db push hubspot --min-score 45 --include-unverified --as-of 2026-10-26
          gtm --db ci.db warehouse push --url "$GTM_TEST_PG_URL" --yes
