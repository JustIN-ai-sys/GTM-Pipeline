[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-pipeline"
version = "0.1.0"
description = "CRM export -> SQL account scoring -> contact enrichment, with tests and CI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # standard library only at runtime

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
review = ["anthropic>=2.3"]  # tools/gtm_review: the PR review agent and its evals
warehouse = ["psycopg[binary]>=3.2"]  # gtm warehouse push (Postgres, Supabase)

[project.scripts]
gtm = "gtm_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
